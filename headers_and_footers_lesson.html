<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headers and footers</title>
    <link rel="icon" type="image/webp" href="/assets/images/header_icon.webp">
</head>
<body>
    <header style="background-color: mediumseagreen;"> <!-- style affects entire header size -->
        <h1>This is the header and footer page!</h1> <!-- header is good place to include the title of the page -->
        <a href="index.html">This will take you home!</a> <br>
        <a href="learn.html">This page is the one for learning html (where you came from)</a> <br>
        <a href="hyrax_wiki.html">My favourite animal!</a> <br> <!-- header is good place to put navigation links to -->
        <hr>
    </header>
    <main style="background-color: red;">
        <h1>This is a rock hyrax: </h1>
        <image src="/assets/images/pwxpatp29bzf1.jpg" width="50%" style="display: block; margin: auto;"> <!-- display: block makes it block level element. Margin: auto distributes horizontal space equally on both sides. -->
        <br>
        <p style="color: white">It is a very cute animal and not a chud!</p>
    </main>
    <footer>
        <hr>
        <p>info</p>

    </footer>
</body>
</html>
